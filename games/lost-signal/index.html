<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Signal — Den dag Taren ringde tillbaka</title>
    <link rel="stylesheet" href="../../assets/css/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode taren-game-page" data-screen="start">
    <main class="lost-signal-app">
        <!-- Build Box -->
        <div class="build-box">Build 128 — Den dag Taren ringde tillbaka</div>

        <!-- Start Screen View -->
        <section id="start-view" class="start-view">
            <div class="intro-content">
                <h1 data-lang-key="game_title">Lost Signal</h1>
                <p class="subtitle">Den dag Taren ringde tillbaka</p>
                <div class="start-actions">
                    <button id="start-btn" class="btn-primary">Start Expedition</button>
                    <button id="reset-btn" class="btn-secondary">Reset Progress</button>
                </div>
            </div>
        </section>

        <!-- Game Interface View -->
        <section id="game-view" class="game-view taren-game-shell" hidden>
            <!-- Sidebar -->
            <aside id="game-sidebar" class="taren-game-sidebar">
                <div class="sidebar-header">
                    <h2 data-lang-key="game_title">Lost Signal</h2>
                    <div id="scene-title">---</div>
                </div>

                <div class="sidebar-section">
                    <h3>Objective</h3>
                    <p id="current-objective">---</p>
                </div>

                <div class="sidebar-section">
                    <h3>Inventory</h3>
                    <div id="inventory-bar"></div>
                </div>

                <div class="signal-container">
                    <h3>Signal Strength</h3>
                    <div class="meter-outer">
                        <div id="signal-value"></div>
                    </div>
                </div>

                <div class="sidebar-footer">
                    <div class="toggle-group">
                        <button id="lang-toggle" class="btn-tiny taren-game-button">EN/SV</button>
                        <button id="theme-toggle" class="btn-tiny taren-game-button">Theme</button>
                    </div>
                    <a href="/games/" class="btn-tiny taren-game-button" style="text-align: center; text-decoration: none; display: block; margin-top: 10px;">Back to Gallery</a>
                    <div style="font-size: 0.6rem; opacity: 0.5; margin-top: 10px; text-align: center;">Mobile shell: active</div>
                </div>
            </aside>

            <!-- Main Area -->
            <main id="game-main" class="taren-game-main">
                <button id="focus-toggle" class="btn-tiny taren-game-button" style="position: absolute; top: 10px; right: 10px; z-index: 200; opacity: 0.5;">Focus</button>
                <div id="scene-viewport" class="taren-game-stage">
                    <div id="scene-container"></div>
                    <div id="hotspot-layer"></div>
                    <svg id="hotspot-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                </div>

                <div id="dialogue-panel">
                    <p id="dialogue-text"></p>
                </div>
            </main>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../../assets/js/build.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
